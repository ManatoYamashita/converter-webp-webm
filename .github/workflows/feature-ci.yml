name: Feature Branch CI

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npx tsc --noEmit

      - name: Build
        id: build
        run: npm run build

      - name: Gather diff summary
        id: diff
        run: |
          git fetch origin prod:refs/remotes/origin/prod || true
          COMMITS=$(git rev-list --count origin/prod..HEAD 2>/dev/null || echo 0)
          echo "commits=${COMMITS}" >> "$GITHUB_OUTPUT"
          git diff --stat origin/prod...HEAD > diff-stat.txt || true
          cat diff-stat.txt

      - name: Create or update PR to prod
        if: success()
        uses: actions/github-script@v7
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          COMMITS_AHEAD: ${{ steps.diff.outputs.commits }}
        with:
          script: |
            const { repo, owner } = context.repo;
            const headBranch = context.ref.replace("refs/heads/", "");
            const base = "prod";
            const title = `chore: sync ${headBranch} to ${base}`;
            const lint = process.env.LINT_RESULT || "unknown";
            const typecheck = process.env.TYPECHECK_RESULT || "unknown";
            const build = process.env.BUILD_RESULT || "unknown";
            const commitsAhead = process.env.COMMITS_AHEAD || "0";
            const fs = require("fs");

            let diffStat = "";
            try {
              diffStat = fs.readFileSync("diff-stat.txt", "utf8");
            } catch (err) {
              diffStat = "差分概要を取得できませんでした。";
            }

            const body = [
              "## 自動生成サマリー",
              `- ソースブランチ: ${headBranch}`,
              `- ベースブランチ: ${base}`,
              `- 先行コミット数: ${commitsAhead}`,
              "",
              "## チェック結果",
              `- Lint: ${lint}`,
              `- Typecheck: ${typecheck}`,
              `- Build: ${build}`,
              "",
              "## 差分概要",
              diffStat || "差分なし"
            ].join("\n");

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${headBranch}`,
              base,
            });

            if (prs.length > 0) {
              const pull_number = prs[0].number;
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number,
                title,
                body,
              });
              core.info(`Updated existing PR #${pull_number}`);
            } else {
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                head: headBranch,
                base,
                title,
                body,
              });
              core.info(`Created PR #${pr.data.number}`);
            }
