name: Prod Quality Gate

on:
  push:
    branches:
      - prod

permissions:
  contents: read

jobs:
  build-and-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start -- --hostname 0.0.0.0 --port 3000 >/tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid

      - name: Wait for server
        run: npx wait-on@7.0.1 http://localhost:3000

      - name: Lighthouse audit
        run: npx @lhci/cli@0.13.0 autorun --collect.url=http://localhost:3000 --collect.numberOfRuns=1 --upload.target=filesystem --assert.preset=lighthouse:recommended

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then
            kill $(cat /tmp/next.pid) || true
          fi
